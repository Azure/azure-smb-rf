version: 2
registries:
  microsoft-cfs-nuget:
    type: nuget-feed
    url: https://packagefeedproxy.microsoft.io/nuget/v3/index.json
  microsoft-cfs-npm:
    type: npm-registry
    url: https://packagefeedproxy.microsoft.io/npm/
    replaces-base: true

updates:
  - package-ecosystem: npm
    directory: /site
    registries:
      - microsoft-cfs-npm
    open-pull-requests-limit: 10
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    groups:
      site-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(site)"

  - package-ecosystem: npm
    directory: /management-console/web
    registries:
      - microsoft-cfs-npm
    open-pull-requests-limit: 10
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    groups:
      management-console-web:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(console-web)"

  - package-ecosystem: nuget
    directory: /management-console/api
    registries:
      - microsoft-cfs-nuget
    open-pull-requests-limit: 10
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    groups:
      management-console-api:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(console-api)"
