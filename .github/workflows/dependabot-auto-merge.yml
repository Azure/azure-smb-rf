name: Dependabot Auto-merge

on:
  workflow_run:
    workflows:
      - Management Console
      - Deploy Docs to GitHub Pages
      - Terraform — smb-ready-foundation
      - Bicep — smb-ready-foundation
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  approve-and-enable-auto-merge:
    name: Approve and enable auto-merge
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      REPOSITORY: ${{ github.repository }}
      VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Verify Dependabot pull request and validated commit
        id: verify
        shell: bash
        run: |
          set -euo pipefail

          pull_request=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")
          default_branch=$(gh api "repos/${REPOSITORY}" --jq '.default_branch')

          if ! jq -e --arg repository "${REPOSITORY}" --arg base "${default_branch}" \
            --arg sha "${VALIDATED_SHA}" \
            '.user.login == "dependabot[bot]" and .base.ref == $base and
             .head.repo.full_name == $repository and .head.sha == $sha and
             .state == "open" and .draft == false' <<< "${pull_request}" > /dev/null; then
            echo "Not a current, open, same-repository Dependabot update; skipping."
            echo "eligible=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          pr_diff=$(gh pr diff "${PR_NUMBER}" --repo "${REPOSITORY}")
          if grep -Eq '^[+-][[:space:]]*uses:[[:space:]]*actions/(deploy-pages|upload-pages-artifact)@' \
            <<< "${pr_diff}"; then
            echo "Pages deployment action updates require human review because those steps are skipped on pull requests."
            echo "eligible=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "eligible=true" >> "${GITHUB_OUTPUT}"

      - name: Wait for all required checks
        if: steps.verify.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh pr checks "${PR_NUMBER}" --repo "${REPOSITORY}" \
            --required --watch --fail-fast --interval 10
          checks=$(gh pr checks "${PR_NUMBER}" --repo "${REPOSITORY}" --json name,state)
          for check_name in "build + lint" "fmt + validate + tflint + test"; do
            check_state=$(jq -r --arg name "${check_name}" \
              '[.[] | select(.name == $name)] |
              if length == 1 then .[0].state else "MISSING_OR_DUPLICATE" end' \
              <<< "${checks}")
            if [[ "${check_state}" != "SUCCESS" ]]; then
              echo "::error::${check_name} must pass before Dependabot auto-merge; state: ${check_state}"
              exit 1
            fi
          done

          all_passed=$(gh pr checks "${PR_NUMBER}" --repo "${REPOSITORY}" \
            --required --json state --jq 'length > 0 and all(.[]; .state == "SUCCESS")')
          if [[ "${all_passed}" != "true" ]]; then
            echo "::error::Required checks must succeed, not be skipped or neutral."
            exit 1
          fi

      - name: Approve validated commit
        if: steps.verify.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail

          current_sha=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')
          if [[ "${current_sha}" != "${VALIDATED_SHA}" ]]; then
            echo "::error::Pull request changed after validation."
            exit 1
          fi

          approval_count=$(gh api --paginate \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and
              .state == \"APPROVED\" and .commit_id == \"${VALIDATED_SHA}\") | .id" |
            wc -l)

          if [[ "${approval_count}" == "0" ]]; then
            # Approval is best-effort: organizations may forbid Actions from
            # approving pull requests, and the ruleset requires no approvals.
            gh api --method POST "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
              -f event=APPROVE -f commit_id="${VALIDATED_SHA}" \
              -f body="All required application, documentation, and dependency checks passed for this commit." ||
              echo "::warning::Could not approve; continuing because required checks gate the merge."
          fi

      - name: Enable squash auto-merge
        if: steps.verify.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "${PR_NUMBER}" --repo "${REPOSITORY}" \
            --auto --squash --delete-branch --match-head-commit "${VALIDATED_SHA}"
