name: Management Console

on:
  push:
    branches: [main]
    paths:
      - "management-console/**"
      - ".github/workflows/management-console.yml"
      - "NuGet.config"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-supply-chain:
    name: Web supply-chain validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: management-console/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify action references are pinned
        uses: suzuki-shunsuke/pinact-action@b1a1f46bb10f2908950d95f626ca8cc109e2cf7d # v3.1.0
        with:
          skip_push: "true"
          github_token: ${{ github.token }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: management-console/web/package-lock.json

      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Audit vulnerabilities
        run: npm audit --audit-level=low

  web-build:
    name: Web production build
    needs: web-supply-chain
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: management-console/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: management-console/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  api-build:
    name: API restore, audit, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: management-console/api
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore and fail on vulnerable packages
        run: >-
          dotnet restore ManagementConsole.Api.csproj --locked-mode
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          '-warnaserror:NU1901;NU1902;NU1903;NU1904'

      - name: Build
        run: dotnet build ManagementConsole.Api.csproj --configuration Release --no-restore
