name: Management Console

on:
  push:
    branches: [main]
    paths:
      - "management-console/**"
      - ".github/workflows/management-console.yml"
      - "NuGet.config"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-supply-chain:
    name: Web supply-chain validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: management-console/web
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Verify action references are pinned
        uses: suzuki-shunsuke/pinact-action@28aeb220eb3252ad0d4422dd5d9368e925acbd8d # v1.3.0
        with:
          fix: "false"
          github_token: ${{ github.token }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: management-console/web/package-lock.json

      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Audit vulnerabilities
        run: npm audit --audit-level=low

  web-build:
    name: Web production build
    needs: web-supply-chain
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: management-console/web
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: management-console/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  api-build:
    name: API restore, audit, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: management-console/api
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore and fail on vulnerable packages
        run: >-
          dotnet restore ManagementConsole.Api.csproj --locked-mode
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          '-warnaserror:NU1901;NU1902;NU1903;NU1904'

      - name: Build
        run: dotnet build ManagementConsole.Api.csproj --configuration Release --no-restore
